<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Carte Hakim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { font-family: 'Segoe UI', sans-serif; background: #0f1923; }

        #map { width: 100%; height: 100vh; }

        /* ── Overlay de chargement ── */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 18, 28, 0.92);
            backdrop-filter: blur(6px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            transition: opacity 0.5s ease;
        }
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-logo {
            font-size: 42px;
            letter-spacing: 2px;
            color: #e74c3c;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(231,76,60,0.5);
        }

        .loader-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 28px 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            min-width: 300px;
        }

        /* Étapes */
        .steps {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0.35;
            transition: opacity 0.4s, transform 0.4s;
        }
        .step.active {
            opacity: 1;
            transform: translateX(4px);
        }
        .step.done {
            opacity: 0.6;
        }
        .step-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(231,76,60,0.15);
            border: 2px solid rgba(231,76,60,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: background 0.3s, border-color 0.3s;
        }
        .step.active .step-icon {
            background: rgba(231,76,60,0.3);
            border-color: #e74c3c;
            animation: pulse-ring 1.2s infinite;
        }
        .step.done .step-icon {
            background: rgba(46,204,113,0.2);
            border-color: #2ecc71;
        }
        @keyframes pulse-ring {
            0%   { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); }
            70%  { box-shadow: 0 0 0 10px rgba(231,76,60,0); }
            100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
        }
        .step-text {
            color: #dce8f0;
            font-size: 14px;
            font-weight: 500;
        }
        .step.active .step-text {
            color: #fff;
            font-weight: 600;
        }
        .step.done .step-text {
            color: #2ecc71;
            text-decoration: line-through;
            text-decoration-color: rgba(46,204,113,0.4);
        }

        /* Barre de progression */
        .progress-bar-wrap {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 99px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e74c3c, #e67e22);
            border-radius: 99px;
            transition: width 0.5s ease;
        }

        .loader-note {
            color: rgba(255,255,255,0.35);
            font-size: 12px;
            text-align: center;
        }

        /* Bouton flottant */
        #btn-localiser {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(231,76,60,0.45);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.2s;
        }
        #btn-localiser:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        /* Tooltips armoires */
        .tooltip-armoire {
            background: rgba(20, 20, 28, 0.9);
            color: #fff;
            border: 1px solid rgba(231,76,60,0.4);
            border-radius: 5px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            white-space: nowrap;
        }
        .tooltip-armoire::before {
            border-top-color: rgba(20,20,28,0.9) !important;
        }
    </style>
</head>
<body>

    <!-- Overlay de chargement -->
    <div id="loading-overlay">
        <div class="loader-logo">📦 Carte Armoires</div>

        <div class="loader-card">
            <div class="steps">
                <div class="step" id="step-1">
                    <div class="step-icon">🗺️</div>
                    <div class="step-text">Initialisation de la carte…</div>
                </div>
                <div class="step" id="step-2">
                    <div class="step-icon">📍</div>
                    <div class="step-text">Localisation de votre position…</div>
                </div>
                <div class="step" id="step-3">
                    <div class="step-icon">📡</div>
                    <div class="step-text">Chargement des armoires à 100 km…</div>
                </div>
            </div>

            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>

            <div class="loader-note" id="loader-note">Démarrage…</div>
        </div>
    </div>

    <div id="map"></div>
    <button id="btn-localiser" onclick="recentrerUtilisateur()">📍 Me localiser</button>

    <script src="script.js"></script>
</body>
</html>
